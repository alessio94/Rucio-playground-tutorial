# Docker Compose override — adds a RustFS S3-compatible node to the testbed.
#
# Usage (from repo root):
#   docker compose \
#     --file etc/docker/dev/docker-compose-qt.yml \
#     --file etc/docker/dev/docker-compose-rustfs-override.yml \
#     --profile storage up -d
#
# RustFS image: https://hub.docker.com/r/rustfs/rustfs
# Verify env-var names match the image version you pull; the access-key /
# secret-key variables below follow RustFS >=0.1 conventions.
#
# Certs are generated by etc/certs/generate_rustfs.sh (called from qt-000-up.sh).
# The relative path below is correct when Docker Compose is invoked with
# --file etc/docker/dev/<this-file>.

services:

  rustfs:
    image: rustfs/rustfs:latest
    container_name: dev-rustfs-1
    hostname: rustfs
    profiles:
      - storage
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: password
      # Force path-style URLs (required for Rucio's S3 integration)
      RUSTFS_DOMAIN: ""
    command: server --address :9003 --certs-dir /certs /data
    ports:
      - "9003:9003"
    volumes:
      - rustfs-data:/data
      - ../../certs/rustfs/public.crt:/certs/public.crt:ro
      - ../../certs/rustfs/private.key:/certs/private.key:ro
    healthcheck:
      test: ["CMD", "curl", "-sk", "https://localhost:9003/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rustfs-data:
